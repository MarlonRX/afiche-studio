<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NodoVec — Your finances under control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/styles/brand.css">
<link rel="stylesheet" href="../../shared/styles/adaptive.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="canvas" data-hf-id="hf-root">
    <div class="mesh"></div>
    <div class="frame"></div>

    <div class="inner">
        <div class="crest">
            <div class="mark" data-hf-id="hf-mark"></div>
            <div class="issue">Financial <b>dashboard</b></div>
        </div>

        <h1>Nodo<em>Vec</em></h1>
        <div class="tagline">Your finances, under <b>control</b></div>

        <div class="divider"><span class="gem"></span></div>

        <div class="kicker">
            <p>Transactions, credit cards and savings goals on <strong>one clear board</strong>, with <em>real-time analytics</em>.</p>
        </div>

        <footer>
            <div class="tags">
                <div class="tag">Laravel API</div>
                <div class="tag">Astro frontend</div>
                <div class="tag gold">Self-hosted</div>
            </div>
            <div class="url">nodo<span>vec</span>.com<small>your data, yours — runs on your own server</small></div>
        </footer>
    </div>
</div>
<script src="../../shared/scripts/adaptive.js"></script>
