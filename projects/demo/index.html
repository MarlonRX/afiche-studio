<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo — Adaptive Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/styles/brand.css">
<link rel="stylesheet" href="../../shared/styles/adaptive.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="canvas" data-hf-id="hf-root">
    <div class="grid" data-hf-id="hf-grid"></div>
    <div class="glow" data-hf-id="hf-glow"></div>
    <header data-hf-id="hf-header">
        <div class="badge"><span class="dot"></span><span id="kicker">Template</span></div>
        <div class="logo" id="logo">Afiche<span>Studio</span></div>
    </header>
    <main data-hf-id="hf-main">
        <div class="txt">
            <h1 id="title">Headline in<br><em>two lines</em></h1>
            <p class="sub" id="subtitle">Supporting line that explains the value proposition in one or two short lines.</p>
        </div>
        <ul class="points" id="points">
            <li>First key point</li>
            <li>Second key point</li>
            <li>Third key point</li>
        </ul>
    </main>
    <footer data-hf-id="hf-footer">
        <div class="cta" id="cta">
            <span>See more</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </div>
        <div class="meta" id="meta"><strong>@username</strong>site.com</div>
    </footer>
</div>
<script src="../../shared/scripts/adaptive.js"></script>
</body>
</html>
